name: Release

# One trigger for everything that ships: the `v*` tag the release skill
# pushes. CI gates every job below; then the CLI binaries, SBOMs, GitHub
# Release, Homebrew formula, crates.io crates and the MCP image are
# published, and pidge-mcp is deployed to Azure, all from the same tagged
# commit. Nothing deploys on a push to `main`.
#
# `workflow_dispatch` is the manual "redeploy the server" button: it runs
# CI and the deploy from the chosen ref (normally `main`) and nothing else,
# for a redeploy that needs no new version, e.g. after rotating
# PIDGE_MCP_ALLOWED_EMAILS.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Run the full CI suite before building release artifacts
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Build release binaries for each platform
  build:
    name: Build ${{ matrix.target }}
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # aws-lc-sys (reqwest's default TLS crypto provider) needs NASM to
      # assemble its optimized routines on Windows; CMake and MSVC are
      # already on the windows-latest image.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # cargo-auditable embeds the dependency list into the binary itself
      # (readable with `cargo audit bin` or syft); cargo-cyclonedx emits a
      # standalone CycloneDX SBOM that ships next to the binary as a release asset.
      - name: Install SBOM tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-cyclonedx

      - name: Build release binary (auditable)
        shell: bash
        run: cargo auditable build --release --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      # One SBOM per target: the dependency graph differs per platform
      # (e.g. windows-sys only on Windows). cargo-cyclonedx writes one file
      # next to every workspace Cargo.toml; keep the binary crate's, drop the rest.
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          cargo cyclonedx \
            --manifest-path crates/pidge/Cargo.toml \
            --format json \
            --spec-version 1.5 \
            --target "$TARGET" \
            --override-filename "$SBOM"
          mv "crates/pidge/${SBOM}.json" "${SBOM}.cdx.json"
          rm -f crates/*/"${SBOM}.json"
        env:
          TARGET: ${{ matrix.target }}
          SBOM: pidge-${{ github.ref_name }}-${{ matrix.target }}

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          cd "target/${TARGET}/release"
          tar czf "../../../pidge-${RELEASE_TAG}-${TARGET}.tar.gz" pidge
          cd ../../..
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/pidge.exe" -DestinationPath "pidge-$env:RELEASE_TAG-$env:TARGET.zip"
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pidge-${{ matrix.target }}
          path: pidge-${{ github.ref_name }}-${{ matrix.target }}.*

  # Create GitHub Release with all binaries
  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the build matrix's archives and SBOMs. The image job stores
      # its own `*.dockerbuild` artifact in this run, which must neither be
      # attached to the release nor downloaded here (its digest check has
      # failed the whole download before).
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: pidge-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  # Update Homebrew tap with new version and SHA256 hashes
  homebrew:
    name: Update Homebrew Tap
    needs: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Update formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="${GITHUB_REF_NAME}"
          BASE_URL="https://github.com/mklab-se/pidge/releases/download/${TAG}"

          # Download release artifacts and compute SHA256
          curl -sL "${BASE_URL}/pidge-${TAG}-aarch64-apple-darwin.tar.gz" -o aarch64-darwin.tar.gz
          curl -sL "${BASE_URL}/pidge-${TAG}-x86_64-apple-darwin.tar.gz" -o x86_64-darwin.tar.gz
          curl -sL "${BASE_URL}/pidge-${TAG}-x86_64-unknown-linux-gnu.tar.gz" -o x86_64-linux.tar.gz

          SHA_AARCH64=$(sha256sum aarch64-darwin.tar.gz | cut -d' ' -f1)
          SHA_X86_64=$(sha256sum x86_64-darwin.tar.gz | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum x86_64-linux.tar.gz | cut -d' ' -f1)

          # Generate formula
          cat > formula.rb <<RUBY
          class Pidge < Formula
            desc "A fast CLI for e-mail and calendar"
            homepage "https://github.com/mklab-se/pidge"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/mklab-se/pidge/releases/download/v#{version}/pidge-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_AARCH64}"
              else
                url "https://github.com/mklab-se/pidge/releases/download/v#{version}/pidge-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64}"
              end
            end

            on_linux do
              url "https://github.com/mklab-se/pidge/releases/download/v#{version}/pidge-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${SHA_LINUX}"
            end

            def install
              bin.install "pidge"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/pidge --version")
            end
          end
          RUBY

          # Push to homebrew-tap repo via GitHub API
          CONTENT=$(base64 -w 0 < formula.rb)
          FILE_SHA=$(gh api repos/mklab-se/homebrew-tap/contents/Formula/pidge.rb --jq '.sha' 2>/dev/null || echo "")

          if [ -n "$FILE_SHA" ]; then
            gh api repos/mklab-se/homebrew-tap/contents/Formula/pidge.rb \
              -X PUT \
              -f message="Update pidge to ${VERSION}" \
              -f content="$CONTENT" \
              -f sha="$FILE_SHA" \
              && echo "Homebrew formula updated to ${VERSION}" \
              || echo "::warning::Failed to update Homebrew tap. Add HOMEBREW_TAP_TOKEN secret with repo scope for mklab-se/homebrew-tap."
          else
            # Create file for the first time
            gh api repos/mklab-se/homebrew-tap/contents/Formula/pidge.rb \
              -X PUT \
              -f message="Add pidge ${VERSION}" \
              -f content="$CONTENT" \
              && echo "Homebrew formula created for ${VERSION}" \
              || echo "::warning::Failed to create Homebrew formula. Add HOMEBREW_TAP_TOKEN secret with repo scope for mklab-se/homebrew-tap."
          fi

  # Publish the pidge-mcp server image to GitHub Container Registry
  image:
    name: Publish MCP image
    needs: ci
    # Forks can't push to ghcr.io/mklab-se/*; skip there instead of failing.
    if: github.repository == 'mklab-se/pidge' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mklab-se/pidge-mcp
          # flavor: latest=auto only tags `latest` for a non-prerelease semver
          # match, so a tag like v1.5.0-rc.1 never moves `latest`.
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/azure/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish to crates.io
  crates-io:
    name: Publish to crates.io
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # In dependency order, skipping any crate whose version is already on
      # crates.io: a version can never be re-uploaded, so this is what lets
      # a tag be re-pushed (or the run re-run) after a partial failure
      # elsewhere in the workflow without failing red here.
      - name: Publish pidge-core, pidge-client, pidge
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for crate in pidge-core pidge-client pidge; do
            status="$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'pidge-release (https://github.com/mklab-se/pidge)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")"
            if [[ "$status" == "200" ]]; then
              echo "${crate} ${version} is already on crates.io; skipping"
              continue
            fi
            cargo publish -p "$crate"
            # Let the index catch up before the next crate resolves this one.
            sleep 30
          done

  # Deploy pidge-mcp to Azure Container Apps from the same commit. Runs
  # for every tag and for a manual dispatch; never for a push to main.
  # The `production` environment fixes the OIDC subject to
  # `repo:mklab-se/pidge:environment:production` whatever the ref, which is
  # the subject the deploy identity's federated credential trusts (see
  # deploy/azure/setup-github-oidc.sh). Forks have no Azure identity to
  # federate with, so the job is skipped there instead of failing.
  deploy:
    name: Deploy MCP
    needs: ci
    if: github.repository == 'mklab-se/pidge'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    # A second trigger queues behind a deploy in progress rather than
    # racing or cancelling it.
    concurrency:
      group: deploy-mcp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # --skip-entra: Phase 4 (Entra callback registration) is done once,
      # by hand; the deploy identity has no Graph directory rights.
      # --skip-certificate: the custom-domain certificate is provisioned
      # once, interactively; CI asserts the binding is SniEnabled and reuses
      # it. deploy.sh keeps the live custom domain and cutover state when
      # PIDGE_MCP_CUSTOM_DOMAIN / PIDGE_MCP_CUTOVER are empty, which they
      # are unless repository variables of those names exist.
      #
      # The image is tagged with the release tag (v1.2.3) on a tag run and
      # with the commit SHA on a manual dispatch.
      - name: Deploy pidge-mcp
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy/azure/deploy.sh --skip-entra --skip-certificate | tee deploy-output.log

          url="$(grep -oE 'MCP endpoint *: https://[^[:space:]]+/mcp' deploy-output.log | awk '{print $NF}' || true)"
          if [[ -z "$url" ]]; then
            echo "warning: could not parse MCP endpoint from deploy output; re-deriving from the Container App" >&2
            fqdn="$(az containerapp show --resource-group pidge --name ca-pidge-mcp \
              --query properties.configuration.ingress.fqdn -o tsv)"
            url="https://$fqdn/mcp"
          fi
          echo "url=${url%/mcp}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
          PIDGE_MCP_ALLOWED_EMAILS: ${{ secrets.PIDGE_MCP_ALLOWED_EMAILS }}
          PIDGE_MCP_CUSTOM_DOMAIN: ${{ vars.PIDGE_MCP_CUSTOM_DOMAIN }}
          PIDGE_MCP_CUTOVER: ${{ vars.PIDGE_MCP_CUTOVER }}

      - name: Smoke test
        shell: bash
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          url="$URL"
          echo "Smoke testing $url"

          curl_retry=(--retry 5 --retry-delay 5 --retry-all-errors --max-time 30)

          health="$(curl -fsS "${curl_retry[@]}" "$url/healthz")"
          if [[ "$health" != "ok" ]]; then
            echo "error: /healthz returned '$health', expected 'ok'" >&2
            exit 1
          fi

          as_metadata="$(curl -fsS "${curl_retry[@]}" "$url/.well-known/oauth-authorization-server")"
          issuer="$(jq -r '.issuer // empty' <<<"$as_metadata")"
          if [[ "$issuer" != "$url" ]]; then
            echo "error: discovery issuer '$issuer' does not match the deployed URL '$url'" >&2
            exit 1
          fi

          resource_metadata="$(curl -fsS "${curl_retry[@]}" "$url/.well-known/oauth-protected-resource")"
          resource="$(jq -r '.resource // empty' <<<"$resource_metadata")"
          if [[ "$resource" != "$url/mcp" ]]; then
            echo "error: protected-resource metadata resource '$resource' does not match '$url/mcp'" >&2
            exit 1
          fi

          status="$(curl -s -o /dev/null -w '%{http_code}' "${curl_retry[@]}" -X POST "$url/mcp")"
          if [[ "$status" != "401" ]]; then
            echo "error: POST $url/mcp without a bearer token returned $status, expected 401" >&2
            exit 1
          fi

          echo "Smoke test passed: healthz ok, issuer=$issuer, resource=$resource, unauthenticated /mcp -> 401"
