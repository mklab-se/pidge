[workspace]
resolver = "2"
members = ["crates/pidge", "crates/pidge-core", "crates/pidge-client", "crates/pidge-mcp"]
# A bare `cargo build` (and the release workflow's `cargo auditable build --release`) builds the
# CLI only; `--workspace` (CI test/clippy) still covers pidge-mcp.
default-members = ["crates/pidge"]

[workspace.package]
version = "1.4.0"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/pidge"
rust-version = "1.88"

[workspace.dependencies]
# CLI
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }

# Async
tokio = { version = "1.53", features = ["full"] }

# HTTP (for update checker, and pidge-client's OAuth + Graph calls)
# rustls-tls-native-roots was renamed rustls in reqwest 0.13; it now validates against the
# live OS trust store (rustls-platform-verifier) with aws-lc-rs as the crypto provider, which
# needs NASM + CMake to build on Windows (see the release workflow's "Install NASM" step and
# INSTALL.md). Ailloy is on the same 0.13 line, so the TLS stack stays shared.
# `form` and `query` are no longer bundled by default in 0.13 (pidge-client's OAuth token
# requests use `.form()`, its Graph calls use `.query()`).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form", "query"] }

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal
colored = "3.1"

# Versioning & time
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Directories
dirs = "7.0"

# AI integration
ailloy = { version = "2.2", default-features = false, features = ["config-tui"] }

# Keychain
# keyring 4 `v1` mode: macOS Keychain, Windows Credential Manager, Secret Service on Linux
keyring = "4.2"

# Base64 (for JWT decoding and PKCE code-challenge)
base64 = "0.23"

# Cryptographic random for PKCE verifier and OAuth state
rand = "0.10"

# YAML for config files
serde_yaml = "0.9"

# Test-only HTTP mock
wiremock = "0.6"

# Table output
comfy-table = { version = "8", features = ["custom_styling"] }
linkify = "0.11"
sha2 = "0.11"

# Bounded per-user LRU for pidge-mcp's read cache
lru = "0.18"

# Inbox show: HTML rendering, image display, formatting
html2text = "0.17"
viuer = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
humansize = "2"

# Interactive prompts (`editor` feature enables `Editor` prompt that opens $EDITOR)
inquire = { version = "0.9", features = ["editor"] }

# Low-level terminal control. Match the version inquire pulls in to avoid
# duplicate crates in the binary.
crossterm = "0.29"

# TUI framework + multi-line text-area widget for the in-pidge body editor.
# ratatui pairs with crossterm (and ailloy's config-tui pulls the same pair);
# versions are kept in sync so we don't bloat the build with two copies.
# ratatui-textarea is the ratatui org's successor to tui-textarea (ratatui 0.30+).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
ratatui-textarea = { version = "0.9", default-features = false, features = ["crossterm"] }

# Future combinators (for join_all in multi-account fetch)
futures = "0.3"

# Object-safe async traits (pidge-client's pluggable token backend)
async-trait = "0.1"

# URL handling
url = "2"

# Testing
tempfile = "3.27"

# Remote MCP server (pidge-mcp)
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "form", "query"] }
http = "1"
tower-http = { version = "0.7", features = ["trace"] }
tokio-util = "0.7"
# pidge-mcp: resource limits for the markitdown subprocess (Linux).
libc = "0.2"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# aws-lc-rs is already the TLS crypto provider (reqwest/rustls); reuse it for HS256
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
azure_core = "1"
azure_identity = "1"
azure_security_keyvault_secrets = "1"

# Internal crates
pidge-core = { version = "1.4.0", path = "crates/pidge-core" }
pidge-client = { version = "1.4.0", path = "crates/pidge-client" }
