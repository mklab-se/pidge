[workspace]
resolver = "2"
members = ["crates/pidge", "crates/pidge-core", "crates/pidge-client"]

[workspace.package]
version = "0.4.1"
edition = "2024"
authors = ["Kristofer Liljeblad <kristofer@mklab.se>"]
license = "MIT"
repository = "https://github.com/mklab-se/pidge"
rust-version = "1.85"

[workspace.dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }

# Async
tokio = { version = "1.40", features = ["full"] }

# HTTP (for update checker)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }

# Errors
anyhow = "1.0"
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Terminal
colored = "2.1"

# Versioning & time
semver = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"

# Directories
dirs = "6.0"

# AI integration
ailloy = { version = "0.7", default-features = false, features = ["config-tui"] }

# Keychain
keyring = "3"

# Base64 (for JWT decoding and PKCE code-challenge)
base64 = "0.22"

# Cryptographic random for PKCE verifier and OAuth state
rand = "0.8"

# YAML for config files
serde_yaml = "0.9"

# Test-only HTTP mock
wiremock = "0.6"

# Table output
comfy-table = { version = "7", features = ["custom_styling"] }
linkify = "0.10"
sha2 = "0.10"

# Inbox show: HTML rendering, image display, formatting
html2text = "0.12"
viuer = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
humansize = "2"

# Interactive prompts (`editor` feature enables `Editor` prompt that opens $EDITOR)
inquire = { version = "0.7", features = ["editor"] }

# Low-level terminal control. Match the version inquire pulls in to avoid
# duplicate crates in the binary.
crossterm = "0.28"

# TUI framework + multi-line text-area widget for the in-pidge body editor.
# ratatui pairs with crossterm; both versions are kept in sync so we don't
# bloat the build with two crossterm copies.
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
tui-textarea = { version = "0.7", default-features = false, features = ["crossterm"] }

# Future combinators (for join_all in multi-account fetch)
futures = "0.3"

# URL handling
url = "2"

# Testing
tempfile = "3.10"

# Internal crates
pidge-core = { version = "0.4.1", path = "crates/pidge-core" }
pidge-client = { version = "0.4.1", path = "crates/pidge-client" }
