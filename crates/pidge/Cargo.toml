[package]
name = "pidge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A fast CLI for e-mail and calendar"
readme = "../../README.md"
keywords = ["email", "calendar", "inbox", "cli", "productivity"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "pidge"
path = "src/main.rs"

[dependencies]
ailloy.workspace = true
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone.workspace = true
dirs.workspace = true
pidge-core.workspace = true
pidge-client.workspace = true
comfy-table.workspace = true
inquire.workspace = true
crossterm.workspace = true
ratatui.workspace = true
tui-textarea.workspace = true
futures.workspace = true
linkify.workspace = true
html2text.workspace = true
humansize.workspace = true
viuer.workspace = true
image.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pidge-v{ version }-{ target }.{ archive-format }"
bin-dir = "pidge{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
