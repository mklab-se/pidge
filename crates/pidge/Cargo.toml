[package]
name = "pidge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The e-mail and calendar client for your AI agent"
readme = "../../README.md"
keywords = ["email", "calendar", "ai", "agent", "cli"]
categories = ["command-line-utilities", "email"]

[[bin]]
name = "pidge"
path = "src/main.rs"

[dependencies]
ailloy = { workspace = true, features = ["config-tui"] }
clap.workspace = true
clap_complete.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
colored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
chrono.workspace = true
iana-time-zone.workspace = true
dirs.workspace = true
async-trait.workspace = true
pidge-core.workspace = true
pidge-client.workspace = true
pidge-gmail.workspace = true
pidge-store.workspace = true
pidge-engine = { workspace = true, features = ["mcp"] }
rmcp.workspace = true
inquire.workspace = true
comfy-table.workspace = true
futures.workspace = true
url.workspace = true
base64.workspace = true
sha2.workspace = true
rand.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` isn't part of the `full` bundle the main dependency pulls in
# (deliberately, to keep it out of release binaries); adding it here merges
# into the same `tokio` build for tests only, enabling `#[tokio::test(start_paused
# = true)]` for the `mcp connect` polling tests.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pidge-v{ version }-{ target }.{ archive-format }"
bin-dir = "pidge{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
